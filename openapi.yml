openapi: 3.0.3
info:
  title: Petstore Smoke Test
  version: 1.0.0
  description: A tiny spec used to exercise guest docs publishing and SDK generation.
servers:
  - url: https://api.petstore-smoketest.example.com
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: A page of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              example:
                - id: 1
                  name: Fido
                  species: dog
    post:
      operationId: createPet
      summary: Create a pet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
            example:
              name: Whiskers
              species: cat
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by id
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: No pet has that id.
components:
  schemas:
    Pet:
      type: object
      required: [id, name, species]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
    NewPet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
    Species:
      type: string
      enum: [dog, cat, bird]
